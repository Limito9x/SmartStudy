services:
  frontend:
    environment:
      - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
      - VITE_API_BASE_URL=${VITE_API_BASE_URL}
    volumes:
      - ./SmartStudy.Client:/app
      - /app/node_modules
    build:
      context: ./SmartStudy.Client
      dockerfile: Dockerfile.Frontend
    container_name: smartstudy_frontend
    ports:
      - "5173:5173"
    networks:
      - smartstudy-network
    restart: unless-stopped
  backend:
    build:
      context: ./SmartStudy.Server
      dockerfile: Dockerfile.Backend
    container_name: smartstudy_backend
    env_file:
      - .env.backend
    ports:
      - "5037:5037"
    networks:
      - smartstudy-network
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_USE_POLLING_FILE_WATCHER=1
      - DOTNET_RUNNING_IN_CONTAINER=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./SmartStudy.Server:/app
    working_dir: /app
    depends_on:
      - smartstudy_db
  smartstudy_db:
    image: pgvector/pgvector:pg17
    container_name: smartstudy_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - smartstudy-network
  redis:
    image: redis:7.0-alpine
    container_name: smartstudy_redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - smartstudy-network
    restart: unless-stopped

  ai_service:
    build: ./SmartStudy.AI
    container_name: smartstudy_ai
    networks:
      - smartstudy-network
    environment:
      - LLAMA_CLOUD_API_KEY=${LLAMA_CLOUD_API_KEY}
      - OPEN_ROUTER_API_KEY=${OPEN_ROUTER_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - DOTNET_INTERNAL_API_BASE_URL=${DOTNET_INTERNAL_API_BASE_URL}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - ./SmartStudy.AI:/app # Đồng bộ trực tiếp code từ máy thật vào container
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload # Chạy với cờ báo reload

  neo4j:
    image: neo4j:latest
    container_name: smartstudy_neo4j
    ports:
      - "7474:7474" # Giao diện Browser (HTTP)
      - "7687:7687" # Cổng kết nối dữ liệu (Bolt)
    volumes:
      - ./neo4j/data:/data
      - ./neo4j/logs:/logs
      - ./neo4j/import:/var/lib/neo4j/import
      - ./neo4j/plugins:/plugins
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=1G
      - NEO4J_dbms_memory_pagecache_size=512m
    networks:
      - smartstudy-network

volumes:
  pgdata:
  redis_data:

networks:
  smartstudy-network:
    driver: bridge
