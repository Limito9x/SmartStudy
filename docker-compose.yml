services:
  smartstudy_db:
    image: pgvector/pgvector:pg17
    container_name: smartstudy_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE}
    ports:
      - "5433:5432"
    volumes:
      # Đảm bảo tắt máy không bao giờ mất data
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - smartstudy-network
  redis:
    image: redis:7.0-alpine
    container_name: smartstudy_redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - smartstudy-network
    restart: unless-stopped

  ai_service:
    build: ./SmartStudy.AI
    container_name: smartstudy_ai
    networks:
      - smartstudy-network
    environment:
      - LLAMA_CLOUD_API_KEY=${LLAMA_CLOUD_API_KEY}
      - OPEN_ROUTER_API_KEY=${OPEN_ROUTER_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - ./SmartStudy.AI:/app # Đồng bộ trực tiếp code từ máy thật vào container
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload # Chạy với cờ báo reload

  neo4j:
    image: neo4j:latest
    container_name: smartstudy_neo4j
    ports:
      - "7474:7474" # Giao diện Browser (HTTP)
      - "7687:7687" # Cổng kết nối dữ liệu (Bolt)
    volumes:
      - ./neo4j/data:/data
      - ./neo4j/logs:/logs
      - ./neo4j/import:/var/lib/neo4j/import
      - ./neo4j/plugins:/plugins
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=1G
      - NEO4J_dbms_memory_pagecache_size=512m
    networks:
      - smartstudy-network

volumes:
  pgdata:
  redis_data:

networks:
  smartstudy-network:
    driver: bridge
