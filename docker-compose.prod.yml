services:
  frontend:
    build:
      context: ./SmartStudy.Client
      dockerfile: Dockerfile.prod
    container_name: smartstudy_frontend
    environment:
      - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
    ports:
      - "80:80"
    networks:
      - smartstudy-network
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    build:
      context: ./SmartStudy.Server
      dockerfile: Dockerfile.prod
    container_name: smartstudy_backend
    env_file:
      - .env.backend
    ports:
      - "5037:5037"
    networks:
      - smartstudy-network
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DOTNET_RUNNING_IN_CONTAINER=true
      - ASPNETCORE_URLS=http://+:5037
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      smartstudy_db:
        condition: service_healthy
    restart: unless-stopped

  smartstudy_db:
    image: pgvector/pgvector:pg17
    container_name: smartstudy_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - smartstudy-network

  redis:
    image: redis:7.0-alpine
    container_name: smartstudy_redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - smartstudy-network
    restart: unless-stopped

  ai_service:
    build:
      context: ./SmartStudy.AI
    container_name: smartstudy_ai
    env_file:
      - .env
    environment:
      - LLAMA_CLOUD_API_KEY=${LLAMA_CLOUD_API_KEY}
      - OPEN_ROUTER_API_KEY=${OPEN_ROUTER_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - DOTNET_INTERNAL_API_BASE_URL=${DOTNET_INTERNAL_API_BASE_URL}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    networks:
      - smartstudy-network
    restart: unless-stopped
    # KHÔNG có volumes mount, KHÔNG có --reload

  neo4j:
    image: neo4j:5.18
    container_name: smartstudy_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=1G
      - NEO4J_dbms_memory_pagecache_size=512m
    networks:
      - smartstudy-network
    restart: unless-stopped

volumes:
  pgdata:
  redis_data:
  neo4j_data:
  neo4j_logs:

networks:
  smartstudy-network:
    driver: bridge
